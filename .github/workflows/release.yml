name: release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$TAG" != "v$version" ]; then
            echo "tag $TAG does not match Cargo.toml version v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-15
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
      - run: mise exec -- cargo build --release --locked --target ${{ matrix.target }}
      - name: package
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/ferry LICENSE dist/
          tar -czf ferry-${{ matrix.target }}.tar.gz -C dist ferry LICENSE
      - name: upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" ferry-${{ matrix.target }}.tar.gz --clobber
      - uses: actions/upload-artifact@v7
        with:
          name: ferry-${{ matrix.target }}
          path: ferry-${{ matrix.target }}.tar.gz

  formula:
    needs: [verify, build]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: checksums
        id: sums
        run: |
          echo "arm=$(sha256sum artifacts/ferry-aarch64-apple-darwin.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "intel=$(sha256sum artifacts/ferry-x86_64-unknown-linux-musl.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
        with:
          repository: pkarpovich/homebrew-apps
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: write formula
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          ARM_SHA: ${{ steps.sums.outputs.arm }}
          INTEL_SHA: ${{ steps.sums.outputs.intel }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p tap/Formula
          cat > tap/Formula/ferry.rb <<RUBY
          class Ferry < Formula
            desc "Call named handlers on another host over one ssh stream"
            homepage "https://github.com/${REPO}"
            version "${VERSION}"
            license "MIT"

            livecheck do
              url :stable
              strategy :github_latest
            end

            on_macos do
              depends_on arch: :arm64

              on_arm do
                url "https://github.com/${REPO}/releases/download/v${VERSION}/ferry-aarch64-apple-darwin.tar.gz"
                sha256 "${ARM_SHA}"
              end
            end

            on_linux do
              depends_on arch: :x86_64

              on_intel do
                url "https://github.com/${REPO}/releases/download/v${VERSION}/ferry-x86_64-unknown-linux-musl.tar.gz"
                sha256 "${INTEL_SHA}"
              end
            end

            def install
              bin.install "ferry"
            end

            test do
              assert_match "ferry call", shell_output("#{bin}/ferry help")
            end
          end
          RUBY
      - name: commit and push
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        working-directory: tap
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/ferry.rb
          if git diff --cached --quiet; then
            echo "formula unchanged"
            exit 0
          fi
          git commit -m "ferry ${VERSION}"
          git push
